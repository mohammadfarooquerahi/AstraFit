version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fitness_coach_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fitness_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness_coach_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/ai-fitness-coach
    depends_on:
      - mongodb
    networks:
      - fitness_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitness_coach_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fitness_network

volumes:
  mongo_data:

networks:
  fitness_network:
    driver: bridge
